<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Sources feed a master profile, a job posting is scored against it, the agent drafts a CV, a validator rejects unverified claims and sends the draft back, then render and format check" font-family="Helvetica,Arial,sans-serif"><title>ATS Resume Tailor pipeline with a claim-verification gate</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8D97B5"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3DDC97"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF6B6B"/></marker></defs><rect width="1200" height="480" rx="18" fill="#0F1426"/><rect x="40" y="60" width="190" height="70" rx="12" fill="#1A2140" stroke="#4A5578" stroke-width="2"/><text x="135.0" y="91.0" font-size="16" fill="#E8ECF4" text-anchor="middle" font-weight="700">Old CVs, GitHub</text><text x="135.0" y="111.0" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">LinkedIn, reviews</text><line x1="230" y1="95" x2="310" y2="95" stroke="#8D97B5" stroke-width="2.2" marker-end="url(#a)"/><text x="270.0" y="86.0" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">ingest</text><rect x="310" y="60" width="210" height="70" rx="12" fill="#3DDC9722" stroke="#3DDC97" stroke-width="2"/><text x="415.0" y="91.0" font-size="16" fill="#E8ECF4" text-anchor="middle" font-weight="700">profile.json</text><text x="415.0" y="111.0" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">master record, private</text><rect x="40" y="200" width="190" height="70" rx="12" fill="#1A2140" stroke="#4A5578" stroke-width="2"/><text x="135.0" y="231.0" font-size="16" fill="#E8ECF4" text-anchor="middle" font-weight="700">Job posting</text><text x="135.0" y="251.0" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">pasted text or file</text><line x1="230" y1="235" x2="310" y2="235" stroke="#8D97B5" stroke-width="2.2" marker-end="url(#a)"/><text x="270.0" y="226.0" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">keywords</text><rect x="310" y="200" width="210" height="70" rx="12" fill="#3DDC9722" stroke="#3DDC97" stroke-width="2"/><text x="415.0" y="231.0" font-size="16" fill="#E8ECF4" text-anchor="middle" font-weight="700">score_match.py</text><text x="415.0" y="251.0" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">score + honest gaps</text><line x1="415" y1="130" x2="415" y2="200" stroke="#8D97B5" stroke-width="2.2" marker-end="url(#a)"/><text x="455" y="170" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">compare</text><line x1="520" y1="235" x2="610" y2="235" stroke="#8D97B5" stroke-width="2.2" marker-end="url(#a)"/><text x="565.0" y="226.0" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">drafts</text><rect x="610" y="200" width="200" height="70" rx="12" fill="#3DDC9722" stroke="#3DDC97" stroke-width="2"/><text x="710.0" y="231.0" font-size="16" fill="#E8ECF4" text-anchor="middle" font-weight="700">cv.json</text><text x="710.0" y="251.0" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">XYZ bullets + source ids</text><line x1="810" y1="235" x2="890" y2="235" stroke="#8D97B5" stroke-width="2.2" marker-end="url(#a)"/><text x="850.0" y="226.0" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">check</text><rect x="890" y="190" width="270" height="90" rx="12" fill="#7AA2FF22" stroke="#7AA2FF" stroke-width="2"/><text x="1025.0" y="231.0" font-size="16" fill="#E8ECF4" text-anchor="middle" font-weight="700">validate_claims.py</text><text x="1025.0" y="251.0" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">numbers, skills, titles, dates</text><line x1="1025" y1="190" x2="1025" y2="100" stroke="#FF6B6B" stroke-width="2.2" marker-end="url(#r)"/><path d="M1025 100 H710 V198" fill="none" stroke="#FF6B6B" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#r)"/><text x="868" y="86" font-size="13" fill="#FF6B6B" text-anchor="middle" font-weight="400">mismatch: fix the bullet, never the profile</text><line x1="1025" y1="280" x2="1025" y2="350" stroke="#3DDC97" stroke-width="2.2" marker-end="url(#g)"/><text x="1085" y="320" font-size="13" fill="#3DDC97" text-anchor="middle" font-weight="400">all verified</text><rect x="890" y="350" width="270" height="70" rx="12" fill="#1A2140" stroke="#4A5578" stroke-width="2"/><text x="1025.0" y="381.0" font-size="16" fill="#E8ECF4" text-anchor="middle" font-weight="700">render_cv.py</text><text x="1025.0" y="401.0" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">HTML, MD, PDF</text><line x1="890" y1="385" x2="720" y2="385" stroke="#8D97B5" stroke-width="2.2" marker-end="url(#a)"/><text x="805.0" y="376.0" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">then</text><rect x="470" y="350" width="250" height="70" rx="12" fill="#3DDC9722" stroke="#3DDC97" stroke-width="2"/><text x="595.0" y="381.0" font-size="16" fill="#E8ECF4" text-anchor="middle" font-weight="700">check_ats_format.py</text><text x="595.0" y="401.0" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">single column, headings, contact</text><text x="40" y="458" font-size="14" fill="#8D97B5" text-anchor="start" font-weight="400">Unverified claims never reach the PDF: the validator exits 1 until every bullet matches the profile.</text></svg>