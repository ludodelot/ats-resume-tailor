0.0" y="286.0" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">ask: is it true? add evidence</text><text x="1160" y="216" font-size="16" fill="#FF6B6B" text-anchor="end" font-weight="700">FAIL</text><text x="40" y="380" font-size="14" fill="#8D97B5" text-anchor="start" font-weight="400">The agent may reword and reorder true facts to match the posting. It cannot add a number, skill or title the profile does not hold.</text></svg>